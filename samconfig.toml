version = 0.1

[default.global.parameters]
stack_name = "serverless-resume-platform-backend"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
region = "ap-south-1"
resolve_s3 = true
s3_prefix = "serverless-resume-platform-backend"
confirm_changeset = false
fail_on_empty_changeset = false